<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💉 위고비 없이 595만원 아끼며 몸짱되기</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            padding-bottom: 100px;
        }

        .top-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(90deg, #ff0000, #ff6b6b);
            padding: 15px;
            text-align: center;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(255,0,0,0.3);
            font-weight: 900;
        }

        .money-amount {
            color: #FFD700;
            font-size: 24px;
            text-shadow: 0 0 10px rgba(255,215,0,0.5);
            animation: pulse-gold 2s infinite;
        }

        @keyframes pulse-gold {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .container {
            max-width: 1200px;
            margin: 80px auto 0;
            padding: 20px;
        }

        .hero {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(180deg, rgba(0,102,204,0.2) 0%, transparent 100%);
            border-radius: 20px;
            margin-bottom: 30px;
        }

        .hero h1 {
            font-size: 42px;
            font-weight: 900;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #0066CC, #00CCFF, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .week-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .week-btn {
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            color: white;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .week-btn:hover {
            background: rgba(0,102,204,0.3);
            border-color: #0066CC;
            transform: scale(1.05);
        }

        .week-btn.active {
            background: #0066CC;
            border-color: #0066CC;
            box-shadow: 0 0 20px rgba(0,102,204,0.5);
        }

        .week-btn.completed {
            background: #28a745;
            border-color: #28a745;
            color: #fff;
        }

        .current-week-info {
            background: rgba(0,102,204,0.1);
            border: 2px solid #0066CC;
            border-radius: 15px;
            padding: 20px;
            margin: 30px 0;
        }

        .dosage-info {
            font-size: 24px;
            color: #FFD700;
            font-weight: 900;
            margin: 10px 0;
            text-align: center;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .stat-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,102,204,0.3);
        }

        .stat-label {
            font-size: 14px;
            color: #999;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 10px;
        }

        .progress-bar {
            height: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 50px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 50px;
            transition: width 1s ease;
        }

        .mission-section {
            background: rgba(0,102,204,0.05);
            border: 2px solid #0066CC;
            border-radius: 20px;
            padding: 30px;
            margin: 30px 0;
        }

        .mission-title {
            font-size: 24px;
            font-weight: 900;
            color: #0066CC;
            margin-bottom: 20px;
            text-align: center;
        }

        .mission-grid { display: grid; gap: 15px; }

        .mission-item {
            display: flex; align-items: center; gap: 15px; padding: 20px;
            background: rgba(255,255,255,0.05); border-radius: 10px;
            cursor: pointer; transition: all 0.3s ease; user-select: none;
        }

        .mission-item:hover { background: rgba(0,102,204,0.2); transform: translateX(10px); }
        .mission-item.completed { background: rgba(0,255,0,0.1); border: 1px solid rgba(0,255,0,0.3); }

        .checkbox {
            min-width: 30px; width: 30px; height: 30px; border: 3px solid #0066CC;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease;
        }

        .mission-item.completed .checkbox { background: #28a745; border-color: #28a745; }
        .mission-item.completed .checkbox::after { content: '✓'; color: white; font-size: 20px; font-weight: 900; }
        .mission-icon { font-size: 30px; }
        .mission-text { flex: 1; }
        .mission-name { font-size: 18px; font-weight: 700; margin-bottom: 5px; }
        .mission-desc { font-size: 14px; color: #999; }

        .diet-section, .mindset-section { border-radius: 20px; padding: 30px; margin: 30px 0; }
        .diet-section { background: rgba(255,215,0,0.05); border: 2px solid #FFD700; }
        .mindset-section { background: linear-gradient(135deg, rgba(255,0,0,0.05), rgba(255,0,0,0.02)); border: 2px solid #FF6B6B; }
        .diet-title, .mindset-title { font-size: 24px; font-weight: 900; margin-bottom: 20px; text-align: center; }
        .diet-title { color: #FFD700; }
        .mindset-title { color: #FF6B6B; }
        .diet-content, .mindset-quote { white-space: pre-wrap; line-height: 1.8; font-size: 16px; }
        .mindset-quote { padding: 20px; background: rgba(255,255,255,0.05); border-radius: 15px; margin: 15px 0; }
        .saju-warning { background: rgba(255,0,0,0.1); border: 2px solid #FF0000; border-radius: 15px; padding: 20px; margin: 20px 0; text-align: center; animation: pulse-red 2s infinite; }
        @keyframes pulse-red { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; } }

        .emergency-btn {
            position: fixed; bottom: 30px; right: 30px; width: 80px; height: 80px; border-radius: 50%;
            background: linear-gradient(135deg, #FF0000, #FF6B6B); border: none; color: white;
            font-size: 14px; font-weight: 900; cursor: pointer; box-shadow: 0 5px 20px rgba(255,0,0,0.4);
            z-index: 999; transition: all 0.3s ease; display: flex; align-items: center; text-align: center; justify-content: center;
        }
        .emergency-btn:hover { transform: scale(1.1); }

        .modal {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95); z-index: 2000; align-items: center; justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content { background: #1a1a1a; border: 3px solid #FF0000; border-radius: 20px; padding: 40px; max-width: 500px; text-align: center; }
        .modal-title { font-size: 36px; font-weight: 900; color: #FF0000; margin-bottom: 20px; }
        .modal-btn { background: linear-gradient(90deg, #0066CC, #00CCFF); border: none; color: white; padding: 15px 40px; font-size: 18px; font-weight: 700; border-radius: 50px; cursor: pointer; margin-top: 20px; }

        @media (max-width: 768px) {
            .hero h1 { font-size: 28px; }
            .week-selector { gap: 5px; }
            .week-btn { padding: 8px 15px; font-size: 14px; }
            .emergency-btn { width: 60px; height: 60px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="top-banner">

            { dosage: "0.25mg", missions: [{ i: "🥩", t: "탄수화물 30% 감축", d: "밥 2/3 공기로 줄이기" },{ i: "💪", t: "홈트 주 3회", d: "스쿼트, 푸시업 각 3세트" },{ i: "🚶", t: "걷기 40분으로 연장", d: "속도보다 시간이 중요" },{ i: "✍️", t: "미루기 즉시 차단", d: "2분 규칙 활용" }], diet: "• 단백질 섭취 의식적 증가 (계란, 닭가슴살)\n• 정제 탄수화물(흰밥, 빵) 피하기", mindset: "\"기록은 실행을 만든다.\"", saju: "⚠️ 유혹 주의! '이것만 먹을까?' 하는 木의 속삭임을 무시하세요." },

            { dosage: "0.25mg", missions: [{ i: "🎯", t: "목표 칼로리 설정", d: "TDEE -500kcal" },{ i: "🍱", t: "밀프렙 시작", d: "2~3가지 메뉴 로테이션" },{ i: "📈", t: "운동 강도 소폭 상향", d: "무게 or 횟수 점진적 증가" },{ i: "🎉", t: "4주 달성 자축", d: "운동 장비(金) 구매" }], diet: "• 주방저울 사용 시작\n• 주말 하루는 클린 식단 유지", mindset: "\"시스템이 나를 자유롭게 한다.\"", saju: "✅ 金 에너지 보충 완료! 실행력이 붙기 시작합니다." },

            { dosage: "0.5mg", missions: [{ i: "📊", t: "매주 사진 기록", d: "같은 조명, 같은 자세" },{ i: "📈", t: "총 볼륨 +10%", d: "세트x무게x횟수 증가" },{ i: "🧘", t: "스트레스 관리", d: "명상 or 산책 10분" },{ i: "🍳", t: "외식 시 건강 메뉴 선택", d: "구이, 회, 샐러드 위주" }], diet: "• 소스, 드레싱 주의\n• 충분한 수분 섭취 (3L 이상)", mindset: "\"나는 내 몸의 마케팅 전문가다.\"", saju: "⚠️ 예측 불가한 일이 피로를 폭증시킵니다. 약속과 일정을 미리 계획하세요." },

            { dosage: "1.0mg", missions: [{ i: "✅", t: "최종 점검", d: "12주 성과 측정" },{ i: "🍽️", t: "지속가능 식단 확립", d: "평생 할 수 있는 패턴 찾기" },{ i: "💪", t: "최애 운동 찾기", d: "가장 즐거운 운동" },{ i: "🎉", t: "12주 완주 자축", d: "PT 세션(金) 등록" }], diet: "• 사회생활, 외식 포함한 식단 계획\n• 나만의 필승 클린 메뉴 만들기", mindset: "\"나는 완전히 달라졌다.\"", saju: "✅ 2026년 대운을 맞이할 준비가 되었습니다. 자신감을 가지세요." },
            // Week 13-16: Phase 4

            { dosage: "1.7mg", missions: [{ i: "🧗", t: "새로운 운동 취미", d: "클라이밍, 크로스핏 등" },{ i: "🤝", t: "운동 파트너 찾기", d: "함께 성장하기" },{ i: "🧠", t: "성공 경험 내재화", d: "자신감으로 연결" },{ i: "🎉", t: "변화된 몸으로 쇼핑", d: "새로운 스타일 도전" }], diet: "• 80/20 법칙 (80% 건강식, 20% 자유식)\n• 스트레스 없는 식단", mindset: "\"나는 계획하고 실행하여 결과를 만드는 사람이다.\"", saju: "⚠️ 木의 사교성을 긍정적으로 활용하세요. 운동 모임에 나가보세요." },

        ];

        const SAVINGS_PER_WEEK = 372025;
        let state = {
            currentWeek: 0,
            completedMissions: {}
        };

        document.addEventListener('DOMContentLoaded', () => {
            loadState();
            initDaysUntil();
            initWeekSelector();
            renderWeek(state.currentWeek);
            updateStats();
        });

        function initDaysUntil() {
            const targetDate = new Date('2026-02-04'); // 경술대운 시작일 (예시)
            const today = new Date();
            const diffTime = targetDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            document.getElementById('daysUntil').textContent = diffDays > 0 ? diffDays : 0;
        }

        function initWeekSelector() {
            const selector = document.getElementById('weekSelector');
            selector.innerHTML = '';
            for (let i = 0; i < 16; i++) {
                const btn = document.createElement('button');
                btn.className = 'week-btn';
                btn.textContent = `${i + 1}주`;
                btn.dataset.week = i;
                if (i === state.currentWeek) btn.classList.add('active');

                const weekMissions = weeklyData[i].missions.map((_, j) => `${i}-${j}`);
                const allComplete = weekMissions.every(id => state.completedMissions[id]);
                if (allComplete) btn.classList.add('completed');

                btn.addEventListener('click', () => {
                    state.currentWeek = i;
                    document.querySelector('.week-btn.active').classList.remove('active');
                    btn.classList.add('active');
                    renderWeek(i);
                    saveState();
                });
                selector.appendChild(btn);
            }
        }

        function renderWeek(weekIndex) {
            const data = weeklyData[weekIndex];
            document.getElementById('selectedWeekText').textContent = `${weekIndex + 1}주차`;
            document.getElementById('currentDosage').textContent = data.dosage;
            document.getElementById('missionTitle').textContent = `📋 ${weekIndex + 1}주차 미션`;
            document.getElementById('dietContent').textContent = data.diet;
            document.getElementById('mindsetQuote').textContent = data.mindset;
            document.getElementById('sajuWarning').textContent = data.saju;

            const missionGrid = document.getElementById('missionGrid');
            missionGrid.innerHTML = '';
            data.missions.forEach((mission, missionIndex) => {
                const id = `${weekIndex}-${missionIndex}`;
                const isCompleted = state.completedMissions[id];
                const item = document.createElement('div');
                item.className = 'mission-item';
                if (isCompleted) item.classList.add('completed');
                item.innerHTML = `
                    <div class="checkbox"></div>
                    <div class="mission-icon">${mission.i}</div>
                    <div class="mission-text">
                        <div class="mission-name">${mission.t}</div>
                        <div class="mission-desc">${mission.d}</div>
                    </div>
                `;
                item.addEventListener('click', () => toggleMission(id, item));
                missionGrid.appendChild(item);
            });
        }

        function toggleMission(id, element) {
            state.completedMissions[id] = !state.completedMissions[id];
            element.classList.toggle('completed');
            updateStats();
            checkWeekCompletion();
            saveState();
        }

        function checkWeekCompletion() {
            const weekIndex = state.currentWeek;
            const weekMissions = weeklyData[weekIndex].missions.map((_, j) => `${weekIndex}-${j}`);
            const allComplete = weekMissions.every(id => state.completedMissions[id]);
            const weekBtn = document.querySelector(`.week-btn[data-week='${weekIndex}']`);
            if (allComplete) {
                weekBtn.classList.add('completed');
            } else {
                weekBtn.classList.remove('completed');
            }
        }

        function updateStats() {
            const totalMissions = weeklyData.reduce((acc, week) => acc + week.missions.length, 0);
            const completedCount = Object.values(state.completedMissions).filter(Boolean).length;
            const progress = totalMissions > 0 ? (completedCount / totalMissions) * 100 : 0;

            // 금(金) 에너지: 전체 진행도
            const goldEnergy = progress;
            document.getElementById('goldEnergy').textContent = `${Math.round(goldEnergy)}%`;
            document.getElementById('goldProgress').style.width = `${goldEnergy}%`;

            // 목(木) 제어력: 현재 주차 진행도
            const currentWeekMissions = weeklyData[state.currentWeek].missions;
            const currentWeekMissionIds = currentWeekMissions.map((_, j) => `${state.currentWeek}-${j}`);
            const currentWeekCompleted = currentWeekMissionIds.filter(id => state.completedMissions[id]).length;
            const woodControl = currentWeekMissions.length > 0 ? (currentWeekCompleted / currentWeekMissions.length) * 100 : 0;
            document.getElementById('woodControl').textContent = `${Math.round(woodControl)}%`;
            document.getElementById('woodProgress').style.width = `${woodControl}%`;

            // 누적 절약 금액
            const completedWeeks = weeklyData.map((week, i) => {
                const weekMissions = week.missions.map((_, j) => `${i}-${j}`);
                return weekMissions.every(id => state.completedMissions[id]);
            }).filter(Boolean).length;
            const totalSavings = completedWeeks * SAVINGS_PER_WEEK;

            const savingsElement = document.getElementById('totalSavings');
            const currentSavings = parseInt(savingsElement.textContent.replace(/[^0-9]/g, '')) || 0;
            animateValue(savingsElement, currentSavings, totalSavings, true);
        }

        function animateValue(element, start, end, isCurrency) {
            if (start === end) return;
            const duration = 1000;
            const range = end - start;
            let current = start;
            const increment = end > start ? 1 : -1;
            const stepTime = Math.abs(Math.floor(duration / range));

            const timer = setInterval(() => {
                current += increment * Math.ceil(range / 100);
                if ((increment > 0 && current >= end) || (increment < 0 && current <= end)) {
                    current = end;
                    clearInterval(timer);
                }
                element.textContent = isCurrency ? `₩${current.toLocaleString()}` : current;
            }, 10);
        }

        function saveState() {
            localStorage.setItem('projectState', JSON.stringify(state));
        }

        function loadState() {
            const savedState = localStorage.getItem('projectState');
            if (savedState) {
                state = JSON.parse(savedState);
            }
        }

        function showEmergency() { document.getElementById('emergencyModal').classList.add('active'); }
        function closeEmergency() { document.getElementById('emergencyModal').classList.remove('active'); }

    </script>
